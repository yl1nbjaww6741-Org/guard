# Auto-deploys worker/ to the real Cloudflare account on every push that
# touches it - replaces the manual "run this in the Codespace" step this
# project relied on through Phase 4's build/debug cycle (real wrangler
# OAuth login kept failing in sandboxed environments, and every deploy
# needing a human with real Cloudflare credentials was the actual
# bottleneck, not anything about the code itself).
#
# Real, considered tradeoff, not an oversight: whoever/whatever holds
# CLOUDFLARE_API_TOKEN below can deploy arbitrary code to this Worker,
# which means bypassing the password gate/ratchet entirely - deploy
# access has always implied that (the Cloudflare account itself already
# had this power), this workflow just makes exercising it require a git
# push instead of a manual `wrangler deploy` from an authenticated
# machine. Acceptable for a single-user personal project; keep the
# token scoped narrowly (Workers Scripts:Edit + D1:Edit only, not a
# full-account token) for the same reason every other Cloudflare API
# token in this project's history has been scoped down, not broad.
#
# Split into typecheck (ungated, fast pass/fail signal) + deploy (gated,
# see below) - same build/publish split as build.yml, for the same
# reason: a push to main shouldn't need approval just to find out
# whether the code even compiles, only to actually reach the real Worker.

name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - claude/contentguard-macos-phase-0-47king
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  # Lets a deploy be triggered by hand from GitHub's Actions tab without
  # needing a throwaway commit, e.g. to redeploy after only a Cloudflare
  # secret changed.
  workflow_dispatch: {}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    name: Typecheck
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # Self-commitment gate, same mechanism and same reviewer as build.yml's
  # `publish` job: targets the `release` GitHub Environment (Settings >
  # Environments > release > required reviewers), already set up for the
  # APK rule - reused here rather than a second environment, since it's
  # the same "a human approves before this becomes live" property either
  # way. This job pauses in the Actions run's own UI until the reviewer
  # approves it; a push to main itself still lands immediately and
  # `typecheck` still runs right away, giving a fast signal to help them
  # decide - but no code reaches the real, deployed Worker without that
  # approval. See SETUP.md section 6 for the full reasoning and the
  # one-time setup steps (already done, this job just reuses it).
  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    name: Deploy
    environment: release
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
