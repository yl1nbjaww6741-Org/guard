# Applies a single D1 migration file to the real remote database, using
# the same scoped CLOUDFLARE_API_TOKEN secret deploy-worker.yml already
# uses. Exists for the same reason that workflow does: wrangler's OAuth
# login can't complete in a sandboxed Codespace, so
# `wrangler d1 execute --remote` had no credentials to run under and
# every migration needed a human on an authenticated machine. The schema
# change and the code depending on it could then land out of order -
# which is exactly what happened with 0003, where the Worker shipped
# queries against pending_profile_changes before the table existed.
#
# Deliberately manual-only (workflow_dispatch, no push trigger). Schema
# changes to a live database are not something to fire automatically on
# every push: re-running an already-applied migration fails, and the
# ordering between "table exists" and "code that uses it is live" is a
# judgement call per migration, not a rule a path filter can encode.
#
# This grants no new power - the token already carries D1:Edit, and
# anything holding it could already run this by hand. It only moves
# where that gets exercised, the same tradeoff deploy-worker.yml names.

name: Apply D1 Migration

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Migration filename in worker/migrations (e.g. 0003_pending_profile_changes.sql)"
        required: true
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    name: Apply migration to remote D1
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Rejects anything that isn't a plain NNNN_name.sql sitting in
      # worker/migrations - the input is interpolated into a --file path,
      # so path traversal and arbitrary-file reads are worth closing off
      # even on a single-user repo.
      - name: Validate migration filename
        env:
          MIGRATION_FILE: ${{ inputs.file }}
        run: |
          if [[ ! "$MIGRATION_FILE" =~ ^[0-9]{4}_[A-Za-z0-9_-]+\.sql$ ]]; then
            echo "::error::'$MIGRATION_FILE' is not a bare NNNN_name.sql migration filename."
            exit 1
          fi
          if [[ ! -f "migrations/$MIGRATION_FILE" ]]; then
            echo "::error::worker/migrations/$MIGRATION_FILE does not exist on this ref."
            exit 1
          fi
          echo "Applying worker/migrations/$MIGRATION_FILE:"
          cat "migrations/$MIGRATION_FILE"

      - name: Install dependencies
        run: npm ci

      - name: Apply migration
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: d1 execute contentguard --remote --file=./migrations/${{ inputs.file }}
