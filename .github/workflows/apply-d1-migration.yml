# Applies a single D1 migration file to the real remote database, using
# the same scoped CLOUDFLARE_API_TOKEN secret deploy-worker.yml already
# uses. Exists for the same reason that workflow does: wrangler's OAuth
# login can't complete in a sandboxed Codespace, so
# `wrangler d1 execute --remote` had no credentials to run under and
# every migration needed a human on an authenticated machine. The schema
# change and the code depending on it could then land out of order -
# which is exactly what happened with 0003, where the Worker shipped
# queries against pending_profile_changes before the table existed.
#
# Triggered by pushing a `d1-migrate-NNNN` tag, where NNNN is a
# migration's number prefix - `git tag d1-migrate-0003 && git push
# origin d1-migrate-0003` applies worker/migrations/0003_*.sql.
#
# The tag, rather than the more obvious workflow_dispatch: GitHub only
# dispatches workflows that exist on the *default* branch, and all of
# this project's Worker development happens on a long-lived feature
# branch that has never been merged to main - dispatching from here
# fails with a 404 (deploy-worker.yml declares workflow_dispatch too,
# and has the same problem; every run it has ever had was push-driven).
# Tag pushes read the workflow from the pushed ref, so this works from
# any branch. The workflow_dispatch trigger is kept below anyway, for
# whenever this branch does reach main.
#
# Deliberately not fired by pushes to worker/migrations/**. Schema
# changes to a live database are not something to run automatically on
# every push: re-running an applied migration fails, and the ordering
# between "table exists" and "code that uses it is live" is a judgement
# call per migration, not a rule a path filter can encode. A tag is a
# deliberate act; a push is not.
#
# This grants no new power - the token already carries D1:Edit, and
# anything holding it could already run this by hand. It only moves
# where that gets exercised, the same tradeoff deploy-worker.yml names.

name: Apply D1 Migration

on:
  push:
    tags:
      - "d1-migrate-*"
  workflow_dispatch:
    inputs:
      file:
        description: "Migration filename in worker/migrations (e.g. 0003_pending_profile_changes.sql)"
        required: true
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    name: Apply migration to remote D1
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Resolves both trigger styles down to one filename, and rejects
      # anything that isn't a plain NNNN_name.sql sitting in
      # worker/migrations - the result is interpolated into a --file
      # path, so path traversal is worth closing off even on a
      # single-user repo. A number prefix matching zero or several files
      # is an error rather than a guess.
      - name: Resolve migration file
        id: resolve
        env:
          DISPATCH_FILE: ${{ inputs.file }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -n "$DISPATCH_FILE" ]]; then
            migration="$DISPATCH_FILE"
          else
            number="${TAG_NAME#d1-migrate-}"
            if [[ ! "$number" =~ ^[0-9]{4}$ ]]; then
              echo "::error::Tag '$TAG_NAME' is not of the form d1-migrate-NNNN."
              exit 1
            fi
            matches=(migrations/"$number"_*.sql)
            if [[ ${#matches[@]} -ne 1 || ! -f "${matches[0]}" ]]; then
              echo "::error::Expected exactly one worker/migrations/${number}_*.sql, found ${#matches[@]}."
              exit 1
            fi
            migration="$(basename "${matches[0]}")"
          fi

          if [[ ! "$migration" =~ ^[0-9]{4}_[A-Za-z0-9_-]+\.sql$ ]]; then
            echo "::error::'$migration' is not a bare NNNN_name.sql migration filename."
            exit 1
          fi
          if [[ ! -f "migrations/$migration" ]]; then
            echo "::error::worker/migrations/$migration does not exist on this ref."
            exit 1
          fi

          echo "file=$migration" >> "$GITHUB_OUTPUT"
          echo "Applying worker/migrations/$migration:"
          cat "migrations/$migration"

      - name: Install dependencies
        run: npm ci

      - name: Apply migration
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: d1 execute contentguard --remote --file=./migrations/${{ steps.resolve.outputs.file }}
