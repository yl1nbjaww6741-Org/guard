name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to create/update the rolling release + upload its asset below -
# without this, some default token permission setups reject the release
# API calls with a 403.
permissions:
  contents: write

jobs:
  # Fast, ungated compile check - always runs immediately on every push,
  # giving a pass/fail signal before anyone has to decide whether to
  # approve the publish job below. Deliberately does NOT hand its build
  # output to publish via actions/upload-artifact - this repo's account
  # hit a persistent Actions artifact storage quota failure
  # ("Failed to CreateArtifact: Artifact storage quota has been hit")
  # that stayed stuck for hours across many attempts, and an early version
  # of this two-job split re-introduced exactly that dependency for the
  # inter-job hand-off. publish rebuilds from scratch instead - slightly
  # redundant, but the Gradle cache (already configured below) makes the
  # second build cheap, and it means this workflow no longer touches
  # Actions artifact storage anywhere.
  build:
    runs-on: ubuntu-latest
    steps:
      # ubuntu-latest ships with several GB of preinstalled toolchains we
      # never touch (.NET, Haskell, Swift, CodeQL) - removing them before
      # the Android SDK/Gradle download anything is the standard fix for
      # "No space left on device" on GitHub-hosted Android CI runners.
      # `rm -rf` on a path that doesn't exist on a given runner image is a
      # silent no-op, not an error, so this is safe even if some of these
      # move or disappear in a future image update.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      # Deliberately WITHOUT lfs: true, unlike publish below. This job is a
      # compile check whose APK is thrown away (see this job's own comment
      # about never handing its output to publish), and compiling needs no
      # model bytes at all - assets are packaged verbatim, so the LFS pointer
      # files stand in fine and every Kotlin/resource error still surfaces.
      # Fetching them here doubled this workflow's LFS bandwidth for a build
      # nobody installs, and LFS bandwidth is a real, exhaustible budget: once
      # it runs out, checkout itself fails ("This repository exceeded its LFS
      # budget") and nothing builds at all until the budget is raised. Only
      # publish, which produces the APK people actually install, needs the
      # real model.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

  # Self-commitment gate: requires a "release" environment configured in
  # this repo's Settings > Environments with a required reviewer. This job
  # pauses here until that person approves it from the Actions run's own
  # UI - independent of branch protection on main (which needs a paid plan
  # to enforce on a private repo; environment protection rules do not).
  # Nothing reaches the real latest-debug release, and nothing is
  # installable, without a human actually approving this specific job -
  # build above running green is a signal to help them decide, not a
  # requirement gating whether they can approve.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      # This job's APK is the one people install, so it is the only place that
      # genuinely needs the real model bytes - an APK carrying a 133-byte LFS
      # pointer where assets/320n.onnx should be would load no classifier at
      # all: gate 7 would score every frame 0f and nothing would ever be
      # blocked. But it deliberately does NOT use checkout's own lfs: true.
      # That fetches from GitHub on every single run, and LFS bandwidth is a
      # finite monthly budget - at this repo's push rate that exhausted the
      # budget outright, at which point checkout itself fails and nothing can
      # be built or released at all. The steps below fetch the same objects
      # through the Actions cache instead, so the bandwidth is paid once per
      # *model change* rather than once per push.
      - name: Checkout
        uses: actions/checkout@v4

      # Keyed on the LFS object IDs themselves (from the pointer files), not
      # on the commit - so every build of an unchanged model reuses one cache
      # entry, and swapping in a new model misses and re-fetches automatically
      # with no key to remember to bump.
      - name: Resolve LFS object IDs
        id: lfs-ids
        run: echo "key=$(git lfs ls-files --long | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # restore/save are split rather than using actions/cache, so the cache is
      # only written after the verification step below has confirmed the
      # objects are real. A combined actions/cache saves in a post-step that
      # runs even when the job failed, which could persist a cache with
      # missing objects under a key that then looks like a hit forever.
      - name: Restore LFS object cache
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs-ids.outputs.key }}

      - name: Fetch LFS objects
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        run: git lfs fetch origin "$GITHUB_SHA"

      # Materializes the working-tree files from the local object store. No
      # network on a cache hit - this is what makes the cached path free.
      - name: Populate working tree from LFS objects
        run: git lfs checkout

      # Hard gate on the failure mode this whole job exists to avoid. Any path
      # that leaves an object unmaterialized - a partial fetch, a stale cache,
      # a future edit that drops the fetch step - would otherwise package the
      # pointer file as the model and produce an APK that installs cleanly,
      # runs happily, and blocks nothing at all. Fail loudly instead of
      # shipping that.
      - name: Verify LFS assets are real files, not pointers
        run: |
          status=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if head -c 64 "$f" | grep -q 'git-lfs.github.com/spec'; then
              echo "::error file=$f::still a Git LFS pointer - the real object was never fetched"
              status=1
            else
              echo "ok: $f ($(stat -c%s "$f") bytes)"
            fi
          done < <(git lfs ls-files --name-only)
          exit $status

      - name: Save LFS object cache
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs-ids.outputs.key }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Publishes to a single rolling "latest-debug" GitHub Release instead
      # of an Actions artifact. Release assets are billed against the
      # repo's normal storage, not the separate Actions artifact storage
      # quota. Uses the `gh` CLI (preinstalled on GitHub-hosted runners,
      # already authenticated via GITHUB_TOKEN) directly instead of a
      # third-party release action, matching this workflow's existing
      # preference for official/well-known actions only. One tag/release
      # ("latest-debug") is created once and its asset is replaced
      # (--clobber) on every run, so there's a single stable URL to
      # bookmark rather than a new release cluttering the list on every
      # push.
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          TAG="latest-debug"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ContentGuard debug build (rolling)" \
              --notes "Automated debug build - always reflects the latest push to main, not a versioned release." \
              --prerelease
          fi
          gh release upload "$TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes "Automated debug build from commit ${GITHUB_SHA} - always reflects the latest push to main, not a versioned release."
