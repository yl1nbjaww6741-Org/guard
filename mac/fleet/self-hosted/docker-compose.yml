# Fleet + MySQL + Redis + cloudflared + Command, all on one box.
#
# Replaces the four-Fly-apps layout (../fleet/, ../mysql/, ../redis/,
# ../tunnel/fly.toml) with one provider-agnostic file - see ../README.md
# for why. Services talk to each other by Compose service name (`mysql`,
# `fleet`, `command`), not by any cloud's private-network DNS, so this
# file is identical on Oracle, Hetzner, or anywhere else Docker runs.
#
# Nothing here publishes a port to the host. The only way in is
# `cloudflared`, outbound-only to Cloudflare's edge - same "no open
# ports" posture the original Fly layout's comments describe.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --dir /data'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  # One-shot migration step - the equivalent of the Fly config's
  # `[deploy] release_command = "fleet prepare db --no-prompt"`, which
  # only exists as a pre-deploy hook on Fly. Runs once, exits, `fleet`
  # below waits for it to succeed before starting.
  fleet-prepare-db:
    image: fleetdm/fleet:latest
    restart: "no"
    command: ["fleet", "prepare", "db", "--no-prompt"]
    environment:
      FLEET_MYSQL_ADDRESS: mysql:3306
      FLEET_MYSQL_DATABASE: ${MYSQL_DATABASE}
      FLEET_MYSQL_USERNAME: ${MYSQL_USER}
      FLEET_MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

  fleet:
    image: fleetdm/fleet:latest
    restart: unless-stopped
    command: ["fleet", "serve"]
    environment:
      FLEET_MYSQL_ADDRESS: mysql:3306
      FLEET_MYSQL_DATABASE: ${MYSQL_DATABASE}
      FLEET_MYSQL_USERNAME: ${MYSQL_USER}
      FLEET_MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      FLEET_REDIS_ADDRESS: redis:6379
      FLEET_REDIS_PASSWORD: ${REDIS_PASSWORD}
      FLEET_SERVER_PRIVATE_KEY: ${FLEET_SERVER_PRIVATE_KEY}
      FLEET_SERVER_ADDRESS: 0.0.0.0:8080
      # TLS terminates at Cloudflare's edge via the Tunnel, same as the
      # Fly setup - the hop from cloudflared to fleet stays inside this
      # box's private Docker network as plain HTTP.
      FLEET_SERVER_TLS: "false"
      FLEET_LOGGING_JSON: "true"
    depends_on:
      fleet-prepare-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]
    # No `ports:` - only cloudflared and other containers on the
    # `backend` network can reach this, same as Fly's "no [[services]]
    # block" apps.

  # TODO: this whole service is a placeholder. This session doesn't have
  # read access to lukep009/command (different GitHub org) to confirm the
  # real build context, env vars, or SQLite path - fill these in from
  # Command's actual Dockerfile/fly.toml before using this file for real.
  command:
    build:
      context: ./command   # TODO: clone lukep009/command here, or point
                            # at its published image instead if it has one
    restart: unless-stopped
    environment: {}         # TODO: whatever Command's runtime needs
    volumes:
      - command_data:/data  # TODO: confirm the real SQLite path
    networks: [backend]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - fleet
      - command
    networks: [backend]
    # Only this container has any route to the public internet, and even
    # that's outbound-only - it dials out to Cloudflare's edge, nothing
    # dials in. Add a second Public Hostname in the Cloudflare Zero Trust
    # dashboard for this same tunnel, pointing at http://command:8080,
    # alongside the existing one pointing at http://fleet:8080 - one
    # tunnel, two routes, no config file needed on this end.

volumes:
  mysql_data:
  redis_data:
  command_data:

networks:
  backend:
    driver: bridge
