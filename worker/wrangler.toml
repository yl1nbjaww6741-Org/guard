# Cloudflare Worker config for the ContentGuard control panel.
#
# account_id and the D1 database_id below are real values, filled in on
# 2026-08-24 from `wrangler whoami` and `wrangler d1 create contentguard`
# respectively - not guessed. Everything else that still reads as a
# placeholder in this repo follows the same rule (see
# profiles/santa-config.mobileconfig's history): a wrong ID silently
# pointing at nothing, or at someone else's account, is worse than an
# obvious placeholder. Remaining setup steps live in
# mac/docs/PHASE_4_DASHBOARD_SETUP.md.

name = "contentguard-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
account_id = "442630b07c6b3eed257dfed98b49cfcd"

# Real custom domain, on the user's own Cloudflare account (same account
# this Worker already deploys to, confirmed - Cloudflare only lets a
# Worker claim a custom domain on a zone the deploying account actually
# owns). No zone_id/zone_name needed here - custom_domain:true auto-
# resolves the zone from the domain itself. Cloudflare provisions the
# DNS record and TLS cert automatically on the next deploy; no manual
# DNS step needed. This has to be placed before any [table] header below
# - TOML keys after a [table] belong to that table, not the top-level
# document, so this was originally (wrongly) written after [vars] and
# silently became vars.routes instead of a real top-level route - caught
# by validating the file with a real TOML parser rather than trusting it
# looked right.
routes = [
  { pattern = "panel.lukep009.download", custom_domain = true }
]

# Explicit, not left to wrangler's default: per wrangler's own real
# source (node_modules/wrangler/wrangler-dist/cli.js's
# getSubdomainValues - `defaultWorkersDev = routes.length === 0`),
# workers_dev SILENTLY defaults to false the moment any `routes` entry
# exists, unless set explicitly here. Found live, the hard way: the
# first deploy of the custom domain above (with no explicit
# workers_dev) immediately 404'd the original
# contentguard-worker.yl1nbjaww6741-4.workers.dev URL, breaking it
# before profiles/santa-config.mobileconfig was ever repushed to point
# Santa at the new domain - exactly the failure this comment originally
# (wrongly) claimed wasn't going to happen. Set true here to actually
# keep both URLs live during the transition; flip to false only once
# everything (santa-config.mobileconfig, the Fleet install flow, the
# Cloudflare Gateway allow rule) is confirmed cut over to the real
# domain.
workers_dev = true

# ContentGuard Central (web/) - the redesigned React dashboard, served
# from THIS SAME Worker at /central/* rather than a separate Cloudflare
# Pages project, specifically to avoid the connector change a separate
# origin would need (real CORS + SameSite=None cookie changes for
# cross-origin session auth - see web/README.md's own "real deployment
# blocker" section). No `binding` set here on purpose: without one,
# Cloudflare's runtime serves a matching static-asset request directly,
# before this Worker's own fetch() handler ever runs - every existing
# route (/, /api/*, /sync/*, everything in index.ts) is completely
# unaffected, zero code changes needed to add this. `directory` points
# at web/'s build output (`cd web && npm run build`, vite.config.ts's
# own comment explains why it nests under dist/central/ rather than
# vite's flat default) - built locally and committed, not built by this
# repo's CI (deploy-worker.yml only ever runs `npm ci`/deploy inside
# worker/, never touches web/), so re-run that build and re-commit
# web/dist/ by hand whenever web/'s source actually changes, same
# "nothing here is computed live at deploy time" reasoning as every
# other hand-kept mirror in this project.
[assets]
directory = "../web/dist"

[[d1_databases]]
binding = "DB"
database_name = "contentguard"
database_id = "8cb09d1d-1497-449f-86d5-f7c754c5f884"

# Hosts the self-packaged Chrome extension .crx for MDM force-install -
# see worker/src/extensionUpdate.ts's own doc comment and
# chrome-extension/build/README.md for the full flow. Re-added
# 2026-08-25 after the first attempt broke every deploy (GitHub Actions
# run #19: "Authentication error [code: 10000]" - the deploy token
# lacked R2 permission, a genuinely different credential from local
# wrangler auth) - fixed by granting that token Account -> Workers R2
# Storage -> Edit, and the bucket itself now exists (`wrangler r2
# bucket list` confirmed it, 2026-08-25T03:18:25Z). binding name
# (EXTENSION_ASSETS) matches types.ts's Env.EXTENSION_ASSETS and every
# env.EXTENSION_ASSETS reference in extensionUpdate.ts - deliberately
# NOT wrangler's own suggested default binding name
# (contentguard_extension) or any other name a different session might
# suggest, since a mismatch here would silently leave those references
# unbound rather than erroring.
[[r2_buckets]]
binding = "EXTENSION_ASSETS"
bucket_name = "contentguard-extension"

# Not a secret - a Fleet host identifier isn't sensitive the way
# FLEET_API_TOKEN is, so this is a plain var, not a `wrangler secret
# put`. Real value: the real Mac's serial number (confirmed via Fleet's
# own host detail page, GGV7PVVR96) - the most stable identifier for a
# specific physical device (survives a hostname rename, unlike relying
# on `Lukes-Air.localdomain`). See types.ts's DEFAULT_FLEET_HOST comment
# for why this exists at all: this project only has one real Mac in
# scope, so the "Installed apps" dashboard section defaults to it
# instead of requiring it typed in every time.
#
# Kept alongside DEFAULT_SIMPLEMDM_DEVICE_ID below through the
# Fleet-to-SimpleMDM migration (mac/docs/PHASE_1C_FLEET_TO_SIMPLEMDM_MIGRATION.md)
# - unused by any code path once ratchet.ts/hostStatus.ts/softwareApi.ts
# are all repointed, removed for real only at that migration's Phase 6
# once fleetClient.ts itself is deleted.
[vars]
DEFAULT_FLEET_HOST = "GGV7PVVR96"

# SimpleMDM's own numeric device ID for the real Mac (confirmed via its
# own device detail page URL, a.simplemdm.com/devices/2381595, after
# Phase 3 of PHASE_1C_FLEET_TO_SIMPLEMDM_MIGRATION.md re-enrolled it).
# Not a secret, same reasoning as DEFAULT_FLEET_HOST above.
DEFAULT_SIMPLEMDM_DEVICE_ID = "2381595"

# Dashboard auth was originally going to reuse the existing Cloudflare
# Zero Trust instance (mac/README.md's Phase 4 row, first draft), but
# that's been abandoned - see this project's git history and
# schema.sql's dashboard_auth comment. What actually gates the dashboard
# now is a password gate built directly into this Worker (src/auth.ts,
# src/session.ts, src/dashboard.ts): a SHA-256 hash of the password lives
# in the dashboard_auth D1 table (bootstrapped via a `wrangler d1
# execute` command, not a Wrangler secret - see
# mac/docs/PHASE_4_DASHBOARD_SETUP.md's setup steps), and changing it
# goes through the same 24h ratchet as loosening a Santa rule.

# Ratchet mechanism (src/ratchet.ts, src/index.ts's `scheduled` export) -
# checks for due loosen requests AND due password changes every 15
# minutes. Not every minute: a 24h delay doesn't need minute-level
# precision, and this keeps the free-tier Cron Trigger invocation count
# sane.
[triggers]
crons = ["*/15 * * * *"]

# Secrets (all set on the real deployment as of Phase 4's close-out -
# see mac/docs/PHASE_4_DASHBOARD_SETUP.md - listed here for reference,
# not because any are still outstanding):
#   - SANTA_SYNC_TOKEN (src/auth.ts's requireSyncToken) - `wrangler
#     secret put SANTA_SYNC_TOKEN`, a static shared token sent by Santa
#     via SyncExtraHeaders (profiles/santa-config.mobileconfig) and
#     checked on every sync-protocol request.
#   - CONTENTGUARD_DAEMON_SYNC_TOKEN (src/auth.ts's requireDaemonSyncToken)
#     - `wrangler secret put CONTENTGUARD_DAEMON_SYNC_TOKEN`, a static
#     shared token ContentGuardDaemon itself sends (X-ContentGuard-Daemon-
#     Token header) to fetch the safe-app-bundle-ID list from GET
#     /sync/safe-apps - see schema.sql's safe_app_bundle_ids comment.
#     Deliberately separate from SANTA_SYNC_TOKEN - see that field's own
#     doc comment in types.ts for why. Provisioned onto the Mac itself via
#     Installer/build-pkg.sh (see mac/README.md), not committed anywhere.
#   - CONTENTGUARD_EXTENSION_SYNC_TOKEN (src/auth.ts's
#     requireExtensionSyncToken) - `wrangler secret put
#     CONTENTGUARD_EXTENSION_SYNC_TOKEN`, a static shared token the
#     Chrome extension's background service worker sends (X-ContentGuard-
#     Extension-Token header) to fetch the blocked-keywords list from GET
#     /sync/keywords - see schema.sql's blocked_keywords comment. A third
#     independent credential, same reasoning as
#     CONTENTGUARD_DAEMON_SYNC_TOKEN being separate from SANTA_SYNC_TOKEN.
#     Baked into the extension's own source (chrome-extension/), which is
#     a meaningfully weaker place to hold a secret than a codesigned Mac
#     binary - accepted, since this token only guards read access to the
#     keyword list, see types.ts's Env comment for the full reasoning.
#   - SESSION_SIGNING_KEY (src/session.ts) - `wrangler secret put
#     SESSION_SIGNING_KEY`, an internal HMAC key for signing dashboard
#     session cookies. Not user-facing and not the dashboard password
#     itself, so it stays a plain Wrangler secret rather than going
#     through D1/the ratchet.
#   - FLEET_BASE_URL / FLEET_API_TOKEN (src/fleetClient.ts) - the real
#     Fleet instance and an API token from its own UI ("My account" ->
#     "Get API token"). Being migrated off - see
#     mac/docs/PHASE_1C_FLEET_TO_SIMPLEMDM_MIGRATION.md - kept set until
#     that migration's Phase 6 decommissions Fleet for real.
#   - SIMPLEMDM_API_KEY (src/simpleMdmClient.ts) - `wrangler secret put
#     SIMPLEMDM_API_KEY`, generated from SimpleMDM's own account
#     settings. Not yet set as of this commit - needed before Phase 5 of
#     PHASE_1C_FLEET_TO_SIMPLEMDM_MIGRATION.md's Worker cutover can be
#     tested for real.
# All fail closed when unset (every /api/... or sync request that needs
# one is rejected until it's real), so leaving any unset is safe, just
# non-functional. The dashboard password hash itself is set the same
# way as before - it lives in D1 (dashboard_auth table), not here.
