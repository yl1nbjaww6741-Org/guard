# Cloudflare Worker config for the ContentGuard control panel.
#
# account_id and the D1 database_id below are real values, filled in on
# 2026-08-24 from `wrangler whoami` and `wrangler d1 create contentguard`
# respectively - not guessed. Everything else that still reads as a
# placeholder in this repo follows the same rule (see
# profiles/santa-config.mobileconfig's history): a wrong ID silently
# pointing at nothing, or at someone else's account, is worse than an
# obvious placeholder. Remaining setup steps live in
# mac/docs/PHASE_4_DASHBOARD_SETUP.md.

name = "contentguard-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
account_id = "442630b07c6b3eed257dfed98b49cfcd"

[[d1_databases]]
binding = "DB"
database_name = "contentguard"
database_id = "8cb09d1d-1497-449f-86d5-f7c754c5f884"

# No route/custom domain configured yet - defaults to the workers.dev
# subdomain Cloudflare assigns on first deploy. Santa's SyncBaseURL in
# profiles/santa-config.mobileconfig gets updated to point at whatever
# real URL this ends up at, once deployed - not before, since guessing
# that URL ahead of time would be exactly the kind of unverified
# real-value placeholder this project has repeatedly caught and fixed
# this session (pppc.mobileconfig, santa-config.mobileconfig's own two
# placeholders).

# Cloudflare Access (mac/README.md's Phase 4 row: dashboard auth reuses
# the existing Zero Trust instance from Phase 1) is configured at the
# Cloudflare dashboard/Zero Trust level, not here - an Access Application
# needs to be created pointing at this Worker's route once one exists.
# See mac/docs/PHASE_4_DASHBOARD_SETUP.md's setup steps. Once that
# Application exists, its team domain and AUD tag go into
# CF_ACCESS_TEAM_DOMAIN/CF_ACCESS_AUD below - src/cloudflareAccess.ts
# verifies every /api/... request's Access JWT against them.

# Ratchet mechanism (src/ratchet.ts, src/index.ts's `scheduled` export) -
# checks for due loosen requests every 15 minutes. Not every minute:
# a 24h delay doesn't need minute-level precision, and this keeps the
# free-tier Cron Trigger invocation count sane.
[triggers]
crons = ["*/15 * * * *"]

# Three secrets, none set yet:
#   - LOOSEN_PASSWORD_HASH (src/auth.ts) - `wrangler secret put
#     LOOSEN_PASSWORD_HASH`, a SHA-256 hex digest of the real password,
#     never the raw password. Deliberately set to the same real password
#     value as the Cloudflare Access login below (the user's explicit
#     choice, for simplicity over the extra friction a genuinely
#     different credential would add).
#   - CF_ACCESS_TEAM_DOMAIN (src/cloudflareAccess.ts) - e.g.
#     "yourteam.cloudflareaccess.com", from the Access Application's
#     settings.
#   - CF_ACCESS_AUD (src/cloudflareAccess.ts) - the Access Application's
#     AUD tag, also from its settings.
# All three fail closed when unset (every /api/... request is rejected
# until they're real), so leaving them unset is safe, just
# non-functional, until Phase 4's actual deployment.
